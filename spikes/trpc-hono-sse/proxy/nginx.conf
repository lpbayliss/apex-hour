events {}

http {
  server {
    listen 8080;

    location /trpc/ {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 2s;
      proxy_send_timeout 2s;
      add_header X-Accel-Buffering no always;
      add_header Cache-Control "no-cache, no-transform" always;
    }
  }
}
